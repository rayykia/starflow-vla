arguments:
- dataset: libero
- img_size: 128
- txt_size: 64
- channel_size: 48
- patch_size: 1
- channels: 1024
- blocks: 6
- layers_per_block: 2 2 2 2 2 12
- head_dim: 64
- pt_seq_len: 8
- rope: 1
- sos: 1
- seq_order: L2R
- nvp: 1
- use_softplus: 1
- cond_top_only: 1
- use_final_norm: 1
- soft_clip: 4
- temporal_causal: 1  # any >0 is equivalent here: only tested ==0; denoiser (block_causal consumer) is disabled
- shallow_block_local: 1
- learnable_self_denoiser: 0
- noise_std: 0.3
- batch_size: 64
- epoch_length: 50000
- lr: 1e-4
- min_lr: 1e-6
- epochs: 100
- drop_label: 0.1
- grad_clip: 1
- grad_skip: 1
- loss_scaling: 1
- save_every: 10
- sample_freq: 5
- vae: Wan-AI/Wan2.2-TI2V-5B-Diffusers:0.6
- finetuned_vae: none
- text: google/flan-t5-xl
- cfg: 1.5
- fsdp: 0
- gradient_checkpoint: 0
- action_horizon: 8
- action_dim: 7
- action_channels: 256
- action_head_dim: 64
- action_layers: 2 2
- action_loss_weight: 1.0
- action_noise_std: 0.1
- libero_root: /home/rayykia/Projects/LIBERO/libero/datasets
- libero_subsets: libero_10
- norm_stats: vla/norm_stats/libero_10.json
- num_workers: 4
